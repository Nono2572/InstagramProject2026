<!DOCTYPE html>
<html>

<head>
    <title>Instagram Login</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="instagram-login-page">

    <div class="container-fluid">

        <div class="row main-content">

            <div class="col-8 left-section">
                <img src="images/LogoTransparent.png"
                    alt="Instagram Logo"
                    class="left-logo">

                <h1 class="main-title">
                    See everyday moments from<br>
                    your <span>close friends.</span>
                </h1>

                <img src="images/FriendsStory.png"
                    alt="Instagram Friends"
                    class="main-image">

            </div>

            <div class="col-4 right-section">

                <div class="login-container">

                    <h1>
                        Log into Instagram
                    </h1>

                    <input type="text"
                        class="form-control login-input"
                        placeholder="Username, email or mobile number">

                    <br>

                    <input type="password"
                        class="form-control login-input"
                        placeholder="Password">

                    <br>

                    <button type="button" class="login-button">
                        Log in
                    </button>

                    <br><br>

                    <a href="#" class="forgot-password-link">
                        Forgot password?
                    </a>

                    <div class="space-section"></div>

                    <button type="button" class="login-with-facebook">
                        Log in with Facebook
                    </button>

                    <button type="button" class="create-account-button">
                        Create new account
                    </button>

                    <p class="meta-text">
                        ∞ Meta
                    </p>

                </div>
            </div>
        </div>

        <div class="row footer-row">
            <div class="col-12">
                <h1> hello </h1>
                <h1> hello </h1>
            </div>
            

        </div>
    </div>
</body>

</html>
