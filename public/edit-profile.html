<!DOCTYPE html>
<html>

<head>
    <title>Instagram - Edit Profile</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="icon"
        type="image/png"
        href="images/LogoTransparent.png">
</head>

<body class="instagram-user-page">

    <div class="user-page-container">

        <div class="user-page-card">

            <h1>
                Edit profile
            </h1>

                <form
                id="edit-profile-form"
                novalidate>

                <label for="edit-full-name">
                    Full name
                </label>

                <input
                    type="text"
                    id="edit-full-name"
                    class="user-page-input"
                    maxlength="50">

                <label for="edit-username">
                    Username
                </label>

                
                <input
                    type="text"
                    id="edit-username"
                    class="user-page-input"
                    maxlength="20">

                <label for="edit-email">
                    Email
                </label>

                <input
                    type="email"
                    id="edit-email"
                    class="user-page-input">

                <label for="edit-bio">
                    Bio
                </label>

                <textarea
                    id="edit-bio"
                    class="user-page-input user-page-textarea"
                    maxlength="150"></textarea>

                <label for="edit-profile-image">
                    Profile image
                </label>

                <input
                    type="file"
                    id="edit-profile-image"
                    class="user-page-input"
                    accept="image/*">

                <p
                    id="edit-profile-message"
                    class="user-page-message">
                </p>

                <button
                    type="submit"
                    class="user-page-primary-button">

                    Save changes
                </button>

            </form>

            <a
                href="profile.html"
                class="user-page-link">

                Cancel
            </a>

        </div>

    </div>
    <script src="js/user-session.js"></script>
    <script src="js/edit-profile.js"></script>

</body>

</html>
