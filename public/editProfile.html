<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header>

    <nav class="main-nav">

        <a
            class="logo"
            href="profile.html"
        >
            InstagramProject2026
        </a>

        <a
            class="nav-link"
            href="profile.html"
        >
            Back to Profile
        </a>

    </nav>

</header>

<main class="page-container">

    <section class="auth-card">

        <h1>Edit Profile</h1>

        <form id="edit-profile-form">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                required
            >

            <button type="submit">
                Save Changes
            </button>

        </form>

        <p
            id="message"
            class="message"
        ></p>

    </section>

</main>

<footer>

    Final Web Applications Project

</footer>

<script src="js/common.js"></script>
