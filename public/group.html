<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group</title>

    <link
        rel="icon"
        type="image/png"
        href="images/LogoTransparent.png"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="single-group-page">

    <div class="single-group-wrapper">


        <!-- =========================================
             SIDEBAR
             ========================================= -->

        <aside class="feed-sidebar">

            <a
                href="feed.html"
                class="instagram-logo-link"
            >
                <img
                    src="images/LogoTransparent.png"
                    class="instagram-sidebar-logo"
                    alt="Instagram Logo"
                >
            </a>


            <div class="sidebar-menu">

                <a
                    class="sidebar-item"
                    href="feed.html"
                >
                    <i class="bi bi-house-door"></i>
                    <span>Home</span>
                </a>


                <a
                    class="sidebar-item active"
                    href="groups.html"
                >
                    <i class="bi bi-people-fill"></i>
                    <span>Groups</span>
                </a>


                <a
                    class="sidebar-item"
                    href="#"
                >
                    <i class="bi bi-send"></i>
                    <span>Messages</span>
                </a>


                <a
                    class="sidebar-item"
                    href="profile.html"
                >
                    <img
                        id="sidebar-profile-image"
                        class="sidebar-profile-image"
                        src="images/BlankProfile.jpg"
                        alt="Profile"
                    >

                    <span>Profile</span>
                </a>

            </div>


            <a
                href="#"
                id="feed-logout-button"
                class="logout-button"
            >
                Log Out
            </a>

        </aside>



        <!-- =========================================
             MAIN CONTENT
             ========================================= -->

        <main class="single-group-content-area">

            <div class="single-group-content">


                <!-- BACK -->

                <a
                    href="groups.html"
                    class="single-group-back"
                >
                    <i class="bi bi-arrow-left"></i>
                    Groups
                </a>



                <!-- =================================
                     LOADING / ERROR
                     ================================= -->

                <p
                    id="group-page-message"
                    class="group-page-message"
                >
                    Loading group...
                </p>



                <!-- =================================
                     GROUP HEADER
                     ================================= -->

                <section
                    id="group-header-card"
                    class="group-header-card"
                    hidden
                >

                    <div class="group-header-main">

                        <div class="group-large-icon">
                            <i class="bi bi-people-fill"></i>
                        </div>


                        <div class="group-header-info">

                            <span
                                id="group-category"
                                class="group-header-category"
                            ></span>


                            <h1 id="group-name"></h1>


                            <p
                                id="group-description"
                                class="group-header-description"
                            ></p>


                            <div class="group-header-meta">

                                <span>
                                    <i class="bi bi-geo-alt"></i>

                                    <span id="group-location"></span>
                                </span>


                                <span>
                                    <i class="bi bi-people"></i>

                                    <span id="group-member-count"></span>
                                </span>


                                <span>
                                    <i class="bi bi-cloud-sun"></i>

                                    <span id="group-weather">
                                        Loading weather...
                                    </span>
                                </span>

                            </div>


                            <div class="group-owner-line">

                                <img
                                    id="group-owner-image"
                                    src="images/BlankProfile.jpg"
                                    alt="Group owner"
                                >

                                <span>
                                    Created by
                                    <strong id="group-owner-name"></strong>
                                </span>


                                
                            </div>
                            
                        </div>



                        <!-- USER ACTIONS -->

                        <div class="group-header-actions">

                            <button
                                type="button"
                                id="join-group-button"
                                class="group-join-button"
                                hidden
                            >
                                Join Group
                            </button>


                            <button
                                type="button"
                                id="leave-group-button"
                                class="group-leave-button"
                                hidden
                            >
                                Leave Group
                            </button>


                            <button
                                type="button"
                                id="edit-group-button"
                                class="group-edit-button"
                                hidden
                            >
                                <i class="bi bi-pencil"></i>
                                Edit
                            </button>


                            <button
                                type="button"
                                id="delete-group-button"
                                class="group-delete-button"
                                hidden
                            >
                                <i class="bi bi-trash"></i>
                            </button>

                        </div>

                    </div>

                </section>

<!-- =================================
     GROUP LOCATION
     ================================= -->

<section
    id="group-location-section"
    class="group-location-section"
    hidden
>

    <div class="group-location-header">

        <div class="group-location-title">

            <div class="group-location-icon">
                <i class="bi bi-geo-alt-fill"></i>
            </div>

            <div>
                <h2>Group Location</h2>

                <p id="group-map-address">
                    Loading location...
                </p>
            </div>

        </div>


        <button
            type="button"
            id="change-group-location-button"
            class="group-location-edit-button"
            hidden
        >
            <i class="bi bi-pencil"></i>
            Change location
        </button>

    </div>


    <div
        id="group-map-empty"
        class="group-map-empty"
        hidden
    >

        <i class="bi bi-geo-alt"></i>

        <h3>No location added</h3>

        <p>
            The group owner has not added
            a location yet.
        </p>

    </div>


    <div
        id="group-map-wrapper"
        class="group-map-wrapper"
        hidden
    >

        <iframe
            id="group-map"
            class="group-map"
            title="Group location on Google Maps"
            loading="lazy"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>

    </div>

</section>

                <!-- =================================
                     BODY
                     ================================= -->

                <div
                    id="group-body"
                    class="single-group-body"
                    hidden
                >


                    <!-- POSTS -->

                    <section class="group-posts-section">

                        <div class="group-section-heading">

                            <div>
                                <h2>Group Posts</h2>

                                <p>
                                    Posts shared with this community
                                </p>
                            </div>

                            <span
                                id="group-post-count"
                                class="group-post-count"
                            >
                                0 posts
                            </span>

                        </div>


                        <div
                            id="group-posts-list"
                            class="group-posts-list"
                        ></div>

                    </section>



                    <!-- MEMBERS -->

                    <aside class="group-members-panel">

                        <div class="group-members-heading">

                            <div>
                                <h2>Members</h2>

                                <p id="members-heading-count">
                                    0 members
                                </p>
                            </div>

                            <i class="bi bi-people"></i>

                        </div>


                        <div
                            id="group-members-list"
                            class="group-members-list"
                        ></div>

                    </aside>

                </div>


            </div>

        </main>

    </div>



    <!-- =============================================
         EDIT GROUP WINDOW
         ============================================= -->

    <div
        id="edit-group-overlay"
        class="edit-group-overlay"
    >

        <div class="edit-group-window">

            <div class="edit-group-window-header">

                <h2>Edit Group</h2>

                <button
                    type="button"
                    id="close-edit-group"
                >
                    &times;
                </button>

            </div>


            <form id="edit-group-form">

                <label for="edit-group-name">
                    Group name
                </label>

                <input
                    type="text"
                    id="edit-group-name"
                    required
                >


                <label for="edit-group-description">
                    Description
                </label>

                <textarea
                    id="edit-group-description"
                    rows="4"
                ></textarea>


                <label for="edit-group-category">
                    Category
                </label>

                <input
                    type="text"
                    id="edit-group-category"
                    required
                >

                <label for="edit-group-location">
                    Group address
                </label>

                <input
                    type="text"
                    id="edit-group-location"
                    placeholder="Dizengoff St 50, Tel Aviv, Israel"
                >


                <p
                    id="edit-group-error"
                    class="groups-error-message"
                ></p>


                <button
                    type="submit"
                    class="groups-primary-button"
                >
                    Save Changes
                </button>

            </form>

        </div>

    </div>



    <script src="js/user-session.js"></script>
    <script src="js/group.js"></script>

</body>

</html>
