<!DOCTYPE html>
<html>

<head>
    <title>Instagram</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="icon"
        type="image/png"
        href="images/LogoTransparent.png">
</head>

<body class="instagram-login-page">

    <div class="container-fluid">

        <div class="row main-content">

            <div class="col-8 left-section">

                <img
                    src="images/LogoTransparent.png"
                    alt="Instagram Logo"
                    class="left-logo">

                <h1 class="main-title">
                    See everyday moments from<br>
                    your <span>close friends.</span>
                </h1>

                <img
                    src="images/FriendsStory.png"
                    alt="Instagram Friends"
                    class="main-image">

            </div>

            <div class="col-4 right-section">

                <div class="login-container">

                    <h1>
                        Log into Instagram
                    </h1>

                    <form
                        id="login-form"
                        novalidate>

                        <input
                            type="text"
                            id="login-identifier"
                            class="form-control login-input"
                            placeholder="Username or email">

                        <p
                            id="identifier-error"
                            class="login-error-message">
                        </p>

                        <input
                            type="password"
                            id="login-password"
                            class="form-control login-input"
                            placeholder="Password">

                        <p
                            id="password-error"
                            class="login-error-message">
                        </p>

                        <p
                            id="login-server-error"
                            class="login-error-message">
                        </p>

                        <button
                            type="submit"
                            class="login-button">

                            Log in
                        </button>

                    </form>

                    <br><br>

                    <button
                        type="button"
                        class="forgot-password-link">

                        Forgot password?
                    </button>

                    <div class="space-section"></div>

                    <a
                        href="register.html"
                        class="create-account-button user-page-link-button">

                        Create new account
                    </a>

                    <p class="meta-text">
                        ∞ Meta
                    </p>

                </div>

            </div>

        </div>

        <div class="row footer-row">

            <div class="col-12">

                <a href="#">Meta</a>
                <a href="#">About</a>
                <a href="#">Blog</a>
                <a href="#">Jobs</a>
                <a href="#">Help</a>
                <a href="#">API</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Locations</a>
                <a href="#">Instagram Lite</a>
                <a href="#">Meta AI</a>
                <a href="#">Threads</a>

                <p>
                    © 2026 Instagram from Colman
                </p>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
