<!DOCTYPE html>
<html>

<head>
    <title>Instagram - My Profile</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="icon"
        type="image/png"
        href="images/LogoTransparent.png">
</head>

<body class="instagram-user-page">

    <div class="profile-page-top">

        <a
            href="feed.html"
            class="profile-back-link">

            Back to feed
        </a>

        <button
            type="button"
            id="profile-logout-button"
            class="profile-logout-button">

            Log out
        </button>

    </div>

    <div class="user-page-container profile-page-container">

        <div class="user-page-card profile-user-card">

            <img
                id="profile-image"
                src="images/BlankProfile.jpg"
                alt="Profile picture"
                class="profile-large-image">

            <h1 id="profile-username"></h1>

            <p
                id="profile-full-name"
                class="profile-full-name">
            </p>

            <p
                id="profile-bio"
                class="profile-bio">
            </p>

            <p id="profile-email"></p>

            <p
                id="profile-created-at"
                class="profile-created-at">
            </p>

            <a
                href="edit-profile.html"
                class="user-page-primary-button profile-edit-link">

                Edit profile
            </a>

            <button
                type="button"
                id="delete-account-button"
                class="delete-account-button">

                Delete account
            </button>

            <p
                id="profile-message"
                class="user-page-error">
            </p>

        </div>

        <div class="user-page-card friends-card">

            <h2>Friends</h2>

            <div class="friend-search-row">
                <input
                    type="text"
                    id="friend-search-input"
                    class="user-page-input"
                    placeholder="Search users by username or name">

                <button
                    type="button"
                    id="friend-search-button"
                    class="friend-action-button primary">
                    Search
                </button>
            </div>

            <p
                id="friends-message"
                class="user-page-message">
            </p>

            <div id="friend-search-results"></div>

            <h3>Friend requests</h3>
            <div id="friend-requests-list"></div>

            <h3>Sent requests</h3>
            <div id="sent-friend-requests-list"></div>

            <h3>My friends</h3>
            <div id="friends-list"></div>

        </div>

    </div>

    <script src="js/profile.js"></script>
    <script src="js/friends.js"></script>

</body>

</html>
