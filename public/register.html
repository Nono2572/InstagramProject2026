<!DOCTYPE html>
<html>

<head>
    <title>Instagram - Register</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="icon"
        type="image/png"
        href="images/LogoTransparent.png">
</head>

<body class="instagram-user-page">

    <div class="user-page-container">

        <div class="user-page-card">

            <img
                src="images/LogoTransparent.png"
                class="user-page-logo"
                alt="Instagram Logo">

            <h1>
                Create new account
            </h1>

            <p class="user-page-description">
                Sign up to join the social network.
            </p>

            <form
                id="register-form"
                novalidate>

                
                <label for="register-full-name">
                    Full name
                </label>

                <input
                    type="text"
                    id="register-full-name"
                    class="user-page-input"
                    maxlength="60">

                <label for="register-username">
                    Username
                </label>

                <input
                    type="text"
                    id="register-username"
                    class="user-page-input"
                    maxlength="20">

                <label for="register-email">
                    Email
                </label>

                <input
                    type="email"
                    id="register-email"
                    class="user-page-input">

                <label for="register-password">
                    Password
                </label>

                <input
                    type="password"
                    id="register-password"
                    class="user-page-input">

                <label for="register-confirm-password">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="register-confirm-password"
                    class="user-page-input">

                <p
                    id="register-error"
                    class="user-page-error">
                </p>

                <button
                    type="submit"
                    class="user-page-primary-button">

                    Register
                </button>

            </form>

            <a
                href="login.html"
                class="user-page-link">

                Already have an account? Log in
            </a>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>

</html>
