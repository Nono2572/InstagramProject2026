<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header>
        <nav class="main-nav">

            <a
                class="logo"
                href="login.html"
            >
                InstagramProject2026
            </a>

            <a
                class="nav-link"
                href="login.html"
            >
                Login
            </a>

        </nav>
    </header>

    <main class="page-container">

        <section class="auth-card">

            <h1>Create Account</h1>

            <form id="register-form">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    minlength="3"
                    maxlength="20"
                    placeholder="Choose a username"
                    required
                >

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="6"
                    placeholder="Create a password"
                    required
                >

                <button type="submit">
                    Register
                </button>

            </form>

            <p
                id="message"
                class="message"
            ></p>

            <p class="switch-page">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>

    <footer>
        Final Web Applications Project
    </footer>

    <script src="js/common.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
